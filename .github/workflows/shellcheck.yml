name: shellcheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -euo pipefail
          files=$(find runtime -type f \( -name '*.sh' -o -name 'claude-docker' -o -name 'codex-docker' -o -name '*-cron-install' -o -name '*-cron-run' \))
          if [ -n "$files" ]; then
            shellcheck $files
          fi
